<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Basic App</title>
  <style>
    body { font-family: sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; background: #f4f6f8; }
    .card { background: #fff; padding: 2rem 3rem; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); text-align: center; }
    button { padding: .6rem 1.2rem; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>My Basic App 🐳</h1>
    <button id="btn">Call API</button>
    <p id="out"></p>
  </div>

  <script>
    document.getElementById('btn').addEventListener('click', async () => {
      const res = await fetch('/api/hello');
      const data = await res.json();
      document.getElementById('out').textContent = data.message;
    });
  </script>
</body>
</html>
